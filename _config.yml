title: Dora Brkarić
description: Dance artist and choreographer. Pula, 1996.
url: "https://ariansajina.github.io"
baseurl: "/dora"
lang: en
theme: null       # no Minima/Primer styling or layouts
markdown: kramdown
permalink: pretty
collections:
  works:
    output: true
    permalink: /works/:name/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
# link previews (og:image): this card unless a page sets its own `image`
defaults:
  - scope: { path: "" }
    values:
      image: { path: /assets/img/share.jpg, alt: "dora brkarić — dancer, choreographer" }
  # works added in Pages CMS don't set a layout
  - scope: { path: "", type: works }
    values:
      layout: work
exclude: [Gemfile, Gemfile.lock, README.md, SOURCES.md, vendor]
